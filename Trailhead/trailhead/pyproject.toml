[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trailhead"
version = "0.1.0"
description = "Experimental Slack interface for Trailhead LLM experiment results"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiolimiter>=1.1.0",
    "anthropic>=0.70.0",
    "cachetools>=5.0",
    "e2b>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "inspect-ai>=0.3",
    "json-repair>=0.30",
    "openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.20",
    "slack-sdk>=3.28",
    "taskipy>=1.13",
    "toon-format>=0.9.0b1",
    "uvicorn>=0.30",
    "fuzzysearch>=0.8.0",
    "rapidfuzz>=3.0",
    "mistune>=3.1.4",
    "markdown-to-mrkdwn>=0.2.0",
    "fastmcp>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.2.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-dotenv>=0.5.2",
    "pytest-httpx>=0.30",
    "pytest-timeout>=2.3.1",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src"]
exclude = ["src/vendor"]
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnusedFunction = "error"
reportMissingParameterType = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/llm"]
# one_off tests are excluded - they're for temporary agent-created tests
markers = [
    "llm: marks tests that make real LLM API calls",
]

[tool.taskipy.tasks]
fmt = "ruff format . && ruff check --fix ."
lint = "ruff check ."
typecheck = "pyright"
test = "pytest -q -m 'not llm'"
test-all = "pytest -q"
test-llm = "pytest -q -m llm"
dev = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"
start = "uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}"
summarize = "python -m src.cli.summarizer"
run = "python -m src.cli.runner"
mcp = "fastmcp run src/mcp_server.py:mcp"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
]

